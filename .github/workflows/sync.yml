name: Sync Pipedrive Israel map

on:
  schedule:
    # Sunday-Thursday 06:00 UTC ~ 09:00 Israel (IDT, UTC+3)
    - cron: "0 6 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = new/changed only (default nightly); full = missing coords; repair = full settlement drift audit"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - repair
      limit:
        description: "Optional max new points (empty = no limit)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-map
  cancel-in-progress: false

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        id: sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PIPEDRIVE_COMPANY_DOMAIN: ${{ secrets.PIPEDRIVE_COMPANY_DOMAIN }}
          USER_AGENT: pipedrive-israel-map/1.0 (github-actions)
        run: |
          # One pin per Pipedrive deal/system. Incremental also migrates legacy
          # person pins → deals on first run after deploy.
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "$MODE" = "repair" ]; then
            echo "Running: python -m src.qa_repair"
            python -m src.qa_repair
            echo "Running: python -m src.audit_repair"
            python -m src.audit_repair
          else
            ARGS="--${MODE}"
            if [ -n "$LIMIT" ]; then
              ARGS="$ARGS --limit $LIMIT"
            fi
            echo "Running: python -m src.sync $ARGS"
            python -m src.sync $ARGS
          fi

      - name: Verify every system remains on a roof
        run: python -m src.validate_map

      - name: Commit updated map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/unmapped_deals.json map/data/projects.geojson
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            ADDED=$(python -c "import json; print(json.load(open('data/unmapped_deals.json')).get('sync',{}).get('added',0))" 2>/dev/null || echo 0)
            UNMAPPED=$(python -c "import json; print(json.load(open('data/unmapped_deals.json')).get('unmapped_total',0))" 2>/dev/null || echo 0)
            git commit -m "chore: sync Pipedrive projects to map (added=${ADDED}, unmapped=${UNMAPPED})"
            git push
          fi
